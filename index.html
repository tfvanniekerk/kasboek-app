  function badFiles() {
    return Object.values(cache.files).filter(f => f.error).map(f => `<div class="row-btn" style="grid-template-columns:1fr auto">
      <span class="who"><b>${esc(f.name)}</b><small>${esc(f.error)}</small></span><span class="badge warn">Overgeslagen</span></div>`).join('');
  }

  function openGithubSheet() {
    const url = gh ? 'https://github.com/' + encodeURIComponent(gh.owner) + '/' + encodeURIComponent(gh.repo) : '';
    const bg = sheet(`
      <h2 id="sh-title" style="font-size:1.25rem">GitHub-koppeling</h2>
      <dl class="kv"><dt>Repository</dt><dd><a href="${esc(url)}" target="_blank" rel="noopener">${esc(gh.owner)}/${esc(gh.repo)}</a></dd>
        <dt>Status</dt><dd>${esc(document.getElementById('sync').textContent)}${sync.msg ? '<br><span class="hint">' + esc(sync.msg) + '</span>' : ''}</dd>
        <dt>Afschriften</dt><dd>${data.statements.length} ingelezen</dd>
        <dt>App-versie</dt><dd class="num">${esc(window.KASBOEK_VERSIE || 'onbekend')}</dd></dl>
      <p class="hint">Op dit apparaat staan alleen de koppeling en een kopie, zodat de app snel opent. Ontkoppelen wist die van dit apparaat; je repository blijft gewoon bestaan.</p>
      <div class="actions"><button class="btn primary" id="g-refresh">Nu vernieuwen</button><button class="btn danger" id="g-off">Ontkoppelen</button><button class="btn" id="sh-close">Sluiten</button></div>`);
    bg.querySelector('#g-refresh').onclick = () => { bg.remove(); loadAll(); };
    const off = bg.querySelector('#g-off');
    off.onclick = () => {
      if (!off.dataset.sure) { off.dataset.sure = '1'; off.textContent = 'Zeker? Tik nog een keer'; return; }
      for (const k of [CFG_KEY, CACHE_KEY, COPY_KEY]) try { localStorage.removeItem(k); } catch (e) {}
      gh = null; cache = { files: {} }; applySettings(null); refreshIndex(); rebuild(); setSync('geen');
      bg.remove(); render();
    };
  }

  // ---------- importeren ----------
  function loadScript(src) {
    return new Promise((res, rej) => {
      const s = document.createElement('script');
      s.src = src; s.onload = res; s.onerror = () => rej(new Error('De PDF-lezer kon niet laden. Controleer je internetverbinding en probeer het opnieuw.'));
      document.head.appendChild(s);
    });
  }
  async function getPdfjs() {
    if (!window.pdfjsLib) {
      await loadScript(PDFJS + 'pdf.min.js');
      await loadScript(PDFJS + 'pdf.worker.min.js');
      window.pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS + 'pdf.worker.min.js';
    }
    return window.pdfjsLib;
  }

  async function importFiles(files) {
    ui.status = { html: 'Bezig met lezen…' }; ui.tab = 'overzicht'; render();
    const msgs = []; let warn = false; let added = 0;
    try {
      const lib = await getPdfjs();
      for (const f of files) {
        try {
          const bytes = new Uint8Array(await f.arrayBuffer());
          const rs = await window.RaboParser.parsePdfAll(lib, bytes.slice());
          const ym = isoOf(rs[0].from).slice(0, 7);
          // staan alle rekeningen uit deze PDF er al in?
          const known = new Set();
          for (const x of Object.values(cache.files)) for (const p of partsOf(x)) known.add(p.statement.iban + '|' + p.statement.from);
          if (rs.every(r => known.has(r.iban + '|' + r.from))) {
            msgs.push(`<b style="text-transform:capitalize">${esc(monthName(ym))}</b>: stond er al in`);
            continue;
          }
          // afschrift in je repository zetten, zodat het op al je apparaten staat
          const safeName = /^[\w.-]+\.pdf$/i.test(f.name) ? f.name : `afschrift-${ym}.pdf`;
          const path = PDF_DIR + '/' + (cache.files[PDF_DIR + '/' + safeName] ? `afschrift-${ym}-${Date.now()}.pdf` : safeName);
          const res = await api('/contents/' + encPath(path), { method: 'PUT', body: JSON.stringify({ message: 'Afschrift ' + monthName(ym) + ' toegevoegd', content: b64FromBytes(bytes) }) });
          const sha = (await res.json()).content.sha;
          cache.files[path] = { sha, name: path.split('/').pop(), parts: rs.map(pack) };
          const before = data.txs.length;
          rebuild();
          const n = data.txs.length - before;
          added += n;
          const ok = rs.every(r => r.check.ok);
          if (!ok) warn = true;
          const extra = rs.length > 1 ? ` (+ ${rs.length - 1} andere rekening${rs.length > 2 ? 'en' : ''})` : '';
          msgs.push(`<b style="text-transform:capitalize">${esc(monthName(ym))}</b>: ${n} nieuw${extra}, opgeslagen in GitHub${ok ? '' : ' (totalen kloppen niet helemaal, controleer dit afschrift)'}`);
        } catch (e) {
          warn = true;
          const known = e.status || e.offline || (e.message && e.message.includes('Rabobank'));
          msgs.push(`<b>${esc(f.name)}</b>: ${esc(known ? e.message : 'dit bestand kon niet gelezen worden. Kies een rekeningafschrift (PDF) van de Rabobank.')}`);
        }
      }
      saveCache();
    } catch (e) {
      warn = true; msgs.push(esc(e.message));
    }
    const summary = added ? `${added} transacties toegevoegd.` : 'Geen nieuwe transacties.';
    ui.status = { warn, html: summary + (files.length <= 3 || warn ? '<br>' + msgs.join('<br>') : ` ${files.length} afschriften gelezen.`) };
    render();
  }

  // ---------- events ----------
  const fileinput = document.getElementById('fileinput');
  fileinput.addEventListener('change', () => { const f = [...fileinput.files]; fileinput.value = ''; if (f.length) importFiles(f); });

  function setTab(t) {
    ui.tab = t; ui.status = null;
    try { localStorage.setItem(STORE + '.tab', t); } catch (e) {}
    render(); window.scrollTo(0, 0);
  }
  document.querySelector('nav.tabs').addEventListener('click', e => { const b = e.target.closest('button[data-tab]'); if (b) setTab(b.dataset.tab); });
  const step = d => { const ms = months(); ui.month = ms[Math.max(0, Math.min(ms.length - 1, ms.indexOf(ui.month) + d))]; render(); };
  document.getElementById('prev').onclick = () => step(-1);
  document.getElementById('next').onclick = () => step(1);

  view.addEventListener('click', e => {
    const el = e.target.closest('[data-act],[data-cat],[data-tx],[data-group],[data-rule],[data-unclear],[data-editcat],[data-savings],[data-unclear-in]');
    if (!el) return;
    if (el.dataset.unclearIn) {
      const v = incomeGroups().find(g => g.key === el.dataset.unclearIn);
      return v && listSheet(v.name, `${v.txs.length} betalingen · +${money(v.total)}`, v.txs);
    }
    if (el.dataset.savings) {
      const acc = (data.accounts || []).find(a => a.iban === el.dataset.savings);
      if (!acc) return;
      const out = -acc.txs.filter(t => t.amount < 0).reduce((s, t) => s + t.amount, 0), inn = acc.txs.filter(t => t.amount > 0).reduce((s, t) => s + t.amount, 0);
      return listSheet((data.namen || {})[acc.iban] || 'Spaarrekening', `afgehaald ${money(out)} · erbij ${money(inn)}`, acc.txs);
    }
    if (el.dataset.unclear) {
      const v = unclearGroups().find(g => g.key === el.dataset.unclear);
      return v && listSheet(v.name, `${v.txs.length} betalingen · ${money(v.total)}`, v.txs);
    }
    if (el.dataset.editcat) return openNewCatSheet(null, el.dataset.editcat);
    if (el.dataset.tx) return openTxSheet(el.dataset.tx);
    if (el.dataset.cat) return openCatSheet(el.dataset.cat);
    if (el.dataset.group) return openGroupSheet(el.dataset.group);
    if (el.dataset.rule) return openRuleSheet(el.dataset.rule);
    const a = el.dataset.act;
    if (a === 'import') { e.stopPropagation(); fileinput.click(); }
    else if (a === 'pin') openPinSheet();
    else if (a === 'files') openFilesSheet();
    else if (a === 'new-rule') openRuleSheet(null);
    else if (a === 'new-cat') openNewCatSheet(null);
    else if (a === 'undo') {
      data.ruleList = data.ruleList.filter(r => r.id !== ui.undo);
      ui.undo = null; ui.status = { html: 'Teruggezet.' }; save(); render();
    }
  });
  view.addEventListener('change', e => {
    if (e.target.dataset && e.target.dataset.assignIn !== undefined) {
      if (e.target.value) assignIncome(e.target.dataset.assignIn, e.target.value);
      if (e.target.isConnected) e.target.value = '';
      return;
    }
    if (e.target.dataset && e.target.dataset.assign !== undefined) {
      if (e.target.value) assignGroup(e.target.dataset.assign, e.target.value);
      if (e.target.isConnected) e.target.value = '';
      return;
    }
    const id = e.target.dataset && e.target.dataset.toggle;
    if (!id) return;
    const r = data.ruleList.find(x => x.id === id);
    if (r) { r.on = e.target.checked; save(); render(); }
  });
  view.addEventListener('pointermove', balanceHover);
  view.addEventListener('pointerdown', balanceHover);
  view.addEventListener('input', e => {
    if (e.target.id === 'search') { ui.search = e.target.value; ui.focusSearch = true; render(); }
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') document.querySelectorAll('.sheet-bg').forEach(s => s.remove()); });

  view.addEventListener('submit', e => {
    if (e.target.id !== 'setup') return;
    e.preventDefault();
    connect(document.getElementById('s-owner').value.trim(), document.getElementById('s-repo').value.trim(), document.getElementById('s-token').value.trim());
  });
  document.getElementById('sync').addEventListener('click', () => { if (gh) openGithubSheet(); });

  // knijp-zoomen tegenhouden (Safari negeert soms user-scalable=no)
  for (const ev of ['gesturestart', 'gesturechange', 'gestureend']) document.addEventListener(ev, e => e.preventDefault(), { passive: false });
  document.addEventListener('touchmove', e => { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });

  // ---------- updates ----------
  // Na elke aanpassing staat er een nieuwe version.json online. Is die anders dan deze versie, dan tonen we een knop.
  let newVersion = null;
  async function checkUpdate() {
    if (!window.KASBOEK_VERSIE) return;
    try {
      const j = await (await fetch('version.json?t=' + Date.now(), { cache: 'no-store' })).json();
      if (j.versie && j.versie !== window.KASBOEK_VERSIE) { newVersion = j.versie; document.getElementById('update').hidden = false; }
    } catch (e) { /* offline: later opnieuw proberen */ }
  }
  document.getElementById('update-btn').addEventListener('click', () => {
    location.replace(location.pathname + '?v=' + encodeURIComponent(newVersion || Date.now()));
  });
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') checkUpdate(); });
  setInterval(checkUpdate, 10 * 60 * 1000);
  checkUpdate();

  render();
  loadAll();
})();
</script>

</html>
